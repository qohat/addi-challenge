name: check

on:
  push:
    branches: [main]
  pull_request:

# One job, one JDK. No matrix: 25 is the only release these classes run on.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: ./gradlew check
